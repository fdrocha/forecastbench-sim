[project]
name = "pandemic-world"
version = "0.1.0"
description = "Pandemic (Starsim SIR) world for ForecastBench-Sim. Plugs into fbsim-core."
requires-python = ">=3.11"
dependencies = [
    "fbsim-core",
    "starsim",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["pandemic_world*"]

[tool.uv.sources]
fbsim-core = { workspace = true }
